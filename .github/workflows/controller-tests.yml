name: Controller tests and WASM build

on:
  push:
    branches: ['feat/tizen-controller-identity']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controllers:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test controller identity and browser mask
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iwasm -Imoonlight-common-c/src tests/gamepad_identity_test.cpp -o /tmp/gamepad-tests
          /tmp/gamepad-tests
          node tests/gamepad_mask_test.js
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python2 unzip aria2
          sudo ln -sf /usr/bin/python2 /usr/bin/python
      - name: Download Samsung Emscripten SDK
        working-directory: ${{ runner.temp }}
        run: |
          aria2c --max-connection-per-server=5 --split=5 --timeout=30 --max-tries=3 --out=samsung-emscripten.zip 'https://developer.samsung.com/smarttv/file/a5013a65-af11-4b59-844f-2d34f14d19a9'
          unzip -q samsung-emscripten.zip
          sed -i 's|https://www.openssl.org/source/old/1.1.1/openssl-|https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1d/openssl-|g' emscripten-release-bundle/emsdk/fastcomp/emscripten/tools/ports/tizen/{ssl,crypto}.py
          cd emscripten-release-bundle/emsdk
          ./emsdk activate latest-fastcomp
      - name: Compile complete Tizen backend and assemble unsigned widget
        run: |
          source "$RUNNER_TEMP/emscripten-release-bundle/emsdk/emsdk_env.sh"
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/emscripten-release-bundle/emsdk/fastcomp/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          cmake --build build --parallel 2
          cmake --install build --prefix "$RUNNER_TEMP/package"
          test -s "$RUNNER_TEMP/package/widget/moonlight-wasm.wasm"
          test -s "$RUNNER_TEMP/package/widget/moonlight-wasm.js"
          test -s "$RUNNER_TEMP/package/widget/moonlight-wasm.worker.js"
          cd "$RUNNER_TEMP/package/widget"
          zip -qr "$GITHUB_WORKSPACE/Moonlight-controller-identity-unsigned.wgt" .
      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-controller-identity-unsigned
          path: Moonlight-controller-identity-unsigned.wgt
          if-no-files-found: error
