name: i18n CI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync-locales-and-push-to-tms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync locale files
        run: node wasm/static/js/i18n-sync.js

      - name: Auto-commit locale changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(i18n): sync locale source-of-truth"
          file_pattern: "wasm/static/locales/*.json"

      - name: Install Crowdin CLI
        run: npm install --global @crowdin/cli
      
      - name: Push source strings to Crowdin
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: crowdin upload sources

