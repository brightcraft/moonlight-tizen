name: i18n CI

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  sync-locales-and-push-to-tms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync locale files
        run: node wasm/static/js/i18n-sync.js

      - name: Create pull request for locale changes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): sync locale source-of-truth"
          branch: "i18n-sync/${{ github.run_id }}"
          title: "chore(i18n): sync locale source-of-truth"
          body: "Automated sync of locale files (wasm/static/locales/*.json)."
          labels: "i18n, automated"
          files: "wasm/static/locales/**"
